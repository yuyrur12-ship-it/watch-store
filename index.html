<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Watch Store | متجر الساعات</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <h1 id="store-name">Luxury Watch Store</h1>
    </div>

    <nav>
        <ul>
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">الساعات</a></li>
            <li><a href="#">العروض</a></li>
            <li><a href="#">تواصل</a></li>
        </ul>
    </nav>

    <div class="actions">
        <button id="lang-btn">EN</button>
        <button>🛒</button>
    </div>
</header>

<section class="hero">
    <div class="overlay">
        <h2>أناقة تليق بوقتك</h2>
        <p>اكتشف أحدث الساعات الفاخرة بأفضل الأسعار.</p>

        <a href="#" class="btn">
            تسوق الآن
        </a>
    </div>
</section>

<section class="products">

    <h2>أحدث الساعات</h2>

    <div class="cards">

        <div class="card">
            <img src="images/watches/watch1.jpg" alt="Watch">
            <h3>Rolex Submariner</h3>
            <p>850$</p>
            <button>أضف إلى السلة</button>
        </div>

        <div class="card">
            <img src="images/watches/watch2.jpg" alt="Watch">
            <h3>Omega Speedmaster</h3>
            <p>720$</p>
            <button>أضف إلى السلة</button>
        </div>

        <div class="card">
            <img src="images/watches/watch3.jpg" alt="Watch">
            <h3>TAG Heuer</h3>
            <p>650$</p>
            <button>أضف إلى السلة</button>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 جميع الحقوق محفوظة.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
